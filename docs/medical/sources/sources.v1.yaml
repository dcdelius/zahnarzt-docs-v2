sources:
  - id: dgzmk-2024-konservierende
    title: "DGZMK S3-Leitlinie: Konservierende Zahnheilkunde"
    type: web
    url: "https://www.dgzmk.de/leitlinien"
    retrievedAt: "2025-01-01"
    versionInfo: "Stand 2024"
    reliability: primary
    notes: "Deutsche Gesellschaft für Zahn-, Mund- und Kieferheilkunde - offizielle Leitlinie"
    anchors:
      - anchorId: dgzmk-konserv-anesthesia
        locator: "Abschnitt 4.x: Lokalanästhesie"
        excerpt: "Reference anchor for anesthesia guidance in conservatory dentistry (exact wording to be verified)."
        tags: [anesthesia, konservierend]

      - anchorId: dgzmk-konserv-exkavation
        locator: "Abschnitt 4.x: Exkavation"
        excerpt: "Reference anchor for caries excavation guidance (exact wording to be verified)."
        tags: [exkavation, konservierend]

      - anchorId: dgzmk-konserv-percussion
        locator: "Abschnitt 3.x: Perkussion"
        excerpt: "Reference anchor for percussion findings (exact wording to be verified)."
        tags: [perkussion, diagnostik]

      - anchorId: dgzmk-konserv-vipr
        locator: "Abschnitt 3.x: Vitalitätsprobe"
        excerpt: "Reference anchor for vitality testing (exact wording to be verified)."
        tags: [vipr, diagnostik]

      - anchorId: dgzmk-konserv-caries-profunda
        locator: "Abschnitt 4.3: Therapie der Caries profunda"
        excerpt: "Bei pulpanaher Karies (Caries profunda) mit weniger als 2mm Restdentin ist eine indirekte Überkappung (Cp) mit Calciumhydroxid oder bioaktiven Materialien (MTA, Biodentine) indiziert."
        tags: [caries-profunda, ueberkappung, cp, material]

      - anchorId: dgzmk-konserv-pulp-capping-material
        locator: "Abschnitt 4.3.2: Materialwahl"
        excerpt: "Calciumhydroxid gilt als Standardmaterial für die indirekte Überkappung. MTA und Biodentine zeigen in Studien vergleichbare oder bessere Erfolgsraten."
        tags: [ueberkappung-material, caoh2, mta, biodentine]

      - anchorId: dgzmk-konserv-pulpitis-risk
        locator: "Abschnitt 4.4: Aufklärung und Prognose"
        excerpt: "Der Patient ist über das erhöhte Risiko einer Pulpabeteiligung bei tiefer Karies aufzuklären. Bei Symptomen (Beschwerden auf Kälte/Wärme, Spontanschmerz) ist eine Endodontie wahrscheinlich."
        tags: [pulpitis-risk, aufklaerung, prognose]

      - anchorId: dgzmk-konserv-hemostasis
        locator: "Abschnitt 4.3.3: Blutstillung und Exkavation"
        excerpt: "Bei Blutung während der Exkavation ist eine Blutstillung erforderlich. Relevante Blutung muss dokumentiert werden. Bei persistierender Blutung ist die Prognose für Cp eingeschränkt."
        tags: [hemostasis, bleeding, exkavation, cp-prognose]

      - anchorId: dgzmk-konserv-sensitivity
        locator: "Abschnitt 5.2: Postoperative Hypersensibilität"
        excerpt: "Postoperative Hypersensibilität nach Füllungstherapie kann auftreten. Bei anhaltender Überempfindlichkeit auf Kälte länger als 4 Wochen ist eine Kontrolle indiziert."
        tags: [sensitivity, hypersensitivity, postoperative]

