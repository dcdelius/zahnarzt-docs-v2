  - id: dgendo-2020-leitlinie
    title: "DGENDO Leitlinie Wurzelkanalbehandlung"
    type: pdf
    url: "https://www.dgendo.de/patienten/leitlinien"
    retrievedAt: "2025-01-01"
    versionInfo: "Stand 2020"
    reliability: primary
    notes: "Deutsche Gesellschaft für Endodontologie und Traumatologie"
    anchors:
      - anchorId: dgendo-indikation-endo
        locator: "Abschnitt 2.1: Indikation zur Wurzelkanalbehandlung"
        excerpt: "Eine Wurzelkanalbehandlung ist indiziert bei irreversibler Pulpitis, Pulpanekrose, apikaler Parodontitis oder bei Trauma mit Pulpabeteiligung."
        tags: [endo, indikation, pulpitis, nekrose]

  - id: dgzmk-endo-leitlinie-2022
    title: "DGZMK S3-Leitlinie: Endodontie (Wurzelkanalbehandlung)"
    type: web
    url: "https://www.dgzmk.de/leitlinien"
    retrievedAt: "2025-01-01"
    versionInfo: "Stand 2022"
    reliability: primary
    notes: "DGZMK Endodontie guideline index (anchors to be verified)."
    anchors:
      - anchorId: dgzmk-endo-kofferdam
        locator: "Abschnitt 3.1: Kofferdam"
        excerpt: "Zur Infektionskontrolle und zum Schutz des Patienten ist die absolute Trockenlegung mittels Kofferdam Standard bei jeder Wurzelkanalbehandlung."
        tags: [endo, kofferdam, isolation]

      - anchorId: dgzmk-endo-wl
        locator: "Abschnitt 3.3: Arbeitslängenbestimmung"
        excerpt: "Die Bestimmung der Arbeitslänge erfolgt elektrometrisch (Apexlokator) oder röntgenologisch. Eine Kombination beider Methoden erhöht die Präzision."
        tags: [endo, arbeitslange, apexlokator]

      - anchorId: dgzmk-endo-irrigation
        locator: "Abschnitt 3.4: Wurzelkanalspülung"
        excerpt: "Die Spülung mit NaOCl (1-5%) ist essenziell zur Desinfektion. EDTA dient der Entfernung der Schmierschicht. Schall- oder Ultraschallaktivierung verbessert die Reinigungseffizienz."
        tags: [endo, spulung, naocl, edta]

      - anchorId: dgzmk-endo-medication
        locator: "Abschnitt 3.5: Medikamentöse Einlage"
        excerpt: "Calciumhydroxid ist das Mittel der Wahl für die medikamentöse Zwischeneinlage. Die Einwirkzeit sollte mindestens 7 Tage betragen."
        tags: [endo, einlage, calciumhydroxid]

      - anchorId: dgzmk-endo-obturation
        locator: "Abschnitt 3.6: Wurzelfüllung"
        excerpt: "Die Obturation erfolgt mit Guttapercha und Sealer. Warmfülltechniken (Thermo-plastisch) oder Lateralkondensation sind etablierte Verfahren."
        tags: [endo, wurzelfullung, guttapercha, sealer]

      - anchorId: dgzmk-endo-pulpitis
        locator: "Abschnitt 2.1: Pulpitis irreversibilis"
        excerpt: "Bei irreversibler Pulpitis ist die Vitalexstirpation indiziert. Charakteristisch sind spontane, anhaltende Schmerzen, verstärkt durch Wärme."
        tags: [endo, pulpitis, diagnose]

      - anchorId: dgzmk-endo-nekrose
        locator: "Abschnitt 2.2: Pulpanekrose"
        excerpt: "Die Pulpanekrose erfordert eine vollständige Wurzelkanalbehandlung. Der Zahn reagiert negativ auf Sensibilitätstests."
        tags: [endo, nekrose, diagnose]

      - anchorId: dgzmk-endo-pa
        locator: "Abschnitt 2.3: Apikale Parodontitis"
        excerpt: "Die apikale Parodontitis zeigt röntgenologisch eine periapikale Aufhellung. Percussion positiv, Sensibilitätstest negativ."
        tags: [endo, pa, apikale-parodontitis]

